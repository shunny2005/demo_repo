name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm test

      # No real hosting behind this demo repo — this step creates a genuine
      # GitHub Deployment + deployment_status via the Deployments API, so
      # Company Brain's engineering-change workflow has a real, observable
      # "this commit was deployed" signal to react to (via the
      # `deployment_status` webhook event) without needing external infra.
      - name: Record deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Company Brain demo deployment',
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Deployed via GitHub Actions (demo — no real hosting)',
            });
